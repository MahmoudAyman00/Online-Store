plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services' // Google Services Plugin
}

android {
    namespace = "com.example.onlineshoppingapp"
    compileSdk = 33 // Latest SDK version

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.onlineshoppingapp"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 21 // Minimum SDK version
        targetSdk = 33
        versionCode = 1
        versionName = "1.0"
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    // Use Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:33.6.0')

    // Firebase Analytics for tracking app activities
   // implementation 'com.google.firebase:firebase-analytics'

    // Firebase Authentication for login/logout
    implementation 'com.google.firebase:firebase-auth'

    // Firebase Firestore for data storage
    implementation 'com.google.firebase:firebase-firestore'

    // Add other Firebase libraries as needed
    // For example:
    // implementation 'com.google.firebase:firebase-storage'  // For file storage
    // implementation 'com.google.firebase:firebase-messaging'  // For push notifications
}


flutter {
    source = "../.."
}
